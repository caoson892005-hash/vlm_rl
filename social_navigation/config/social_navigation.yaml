# Safety tuning for the only node this package still runs. People localization
# and social-region detection belong to social_perception.
#
# This file holds tuning that is identical on Gazebo and on hardware. Anything
# that differs between the two (use_sim_time and the cmd_vel topic names) is a
# launch argument of social_safety.launch.py, so one profile never silently
# leaks into the other.
social_velocity_filter:
  ros__parameters:
    slow_distance: 2.2
    stop_distance: 0.65
    resume_distance: 0.85
    minimum_speed_scale: 0.12
    direction_margin: 0.2
    collision_horizon: 2.0
    collision_clearance: 0.7
    predicted_stop_clearance: 0.48
    people_timeout: 0.35
    # If VLM confirms a social region after the robot has already entered it,
    # permit only a slow command that increases clearance from every nearby
    # person. Rotation is always retained so a differential robot can first
    # face the open side.
    robot_frame: base_link
    transform_timeout: 0.05
    escape_evaluation_time: 0.6
    # Zero permits the initially tangential motion needed when the robot is
    # exactly between two people; the predicted distance still may not shrink.
    escape_minimum_progress: 0.0
    escape_maximum_speed: 0.12
    # The base must not keep the last non-zero command if the upstream mux,
    # Nav2 or teleop process dies. The filter republishes zero while stale.
    input_command_timeout: 0.35
    watchdog_rate: 10.0
    # ...and then stops republishing. This many seconds of zeros (10 messages
    # at watchdog_rate) is what brings the wheels to a stop; they stay stopped
    # because zero is the last command they received. Staying an active
    # publisher beyond that is what silently overwrote the RL trainer on
    # /cmd_vel_safe once rl_agent had been started and closed in the same
    # Gazebo session -- two commands out of three replaced by zero.
    stop_broadcast_time: 1.0
